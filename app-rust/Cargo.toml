[package]
name = "grapevine-workbench"
version = "0.48.0-beta.3"
edition = "2024"
license = "Apache-2.0"
publish = false
autobins = false

[[bin]]
name = "Inconnu"
path = "src/main.rs"

[dependencies]
grapevine-legacy-reader = { path = "../compatibility" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
uuid = { version = "1.27", features = ["v4", "v5", "serde"] }
sha2 = "0.11"
encoding_rs = "0.8"
roxmltree = "0.21"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.17"
tempfile = "3.27"

[profile.release]
strip = true
